ProxyRequests Off
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
# Keep AutoSSL validation on Apache's document root.
ProxyPass /.well-known/acme-challenge/ !
ProxyPass /.well-known/pki-validation/ !
ProxyPass / http://127.0.0.1:3300/ retry=0 timeout=40
ProxyPassReverse / http://127.0.0.1:3300/
