ProxyRequests Off
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
# Keep AutoSSL validation on Apache's document root.
ProxyPass /.well-known/acme-challenge/ !
ProxyPass /.well-known/pki-validation/ !
# Streaming downloads can remain open while data keeps flowing. This is an
# inactivity timeout, scoped only to the public download paths.
ProxyPass /d/ http://127.0.0.1:3300/d/ retry=0 timeout=90
ProxyPass / http://127.0.0.1:3300/ retry=0 timeout=40
ProxyPassReverse / http://127.0.0.1:3300/
